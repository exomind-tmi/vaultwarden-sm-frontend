name: Build web vault bundle

# Builds the overlay: fetches the pinned bitwarden/clients tag, applies our clean-room
# overlay + patches, and produces the static web-vault bundle (dist/) as an artifact.
# Runs on GitHub-hosted ubuntu so the upstream Node/npm toolchain is available.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
      - name: Pin npm to the upstream-required major
        run: npm i -g npm@11
      - name: Build the overlay web-vault bundle
        run: node scripts/build.mjs
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-vault-dist
          path: dist/
          if-no-files-found: error

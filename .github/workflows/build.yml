name: Build web vault bundle

# Builds the overlay: fetches the pinned bitwarden/clients tag, applies our clean-room overlay +
# patches, produces the static web-vault bundle (dist/), and publishes it as both a CI artifact and
# a tiny carrier image on ghcr. Runs on GitHub-hosted ubuntu for the upstream Node/npm toolchain.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      IMAGE: ghcr.io/exomind-tmi/vaultwarden-sm-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
      - name: Pin npm to the upstream-required major
        run: npm i -g npm@11
      - name: Build the overlay web-vault bundle
        run: node scripts/build.mjs
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-vault-dist
          path: dist/
          if-no-files-found: error

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push carrier image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

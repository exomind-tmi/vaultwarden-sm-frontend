<app-header [title]="name()" icon="bwi-wrench">
  <bit-breadcrumbs slot="breadcrumbs">
    <bit-breadcrumb [route]="['/sm', organizationId, 'machine-accounts']" icon="bwi-angle-left">
      Machine accounts
    </bit-breadcrumb>
  </bit-breadcrumbs>
  <bit-tab-nav-bar label="Machine account" slot="tabs">
    <bit-tab-link [route]="['access-tokens']">Access tokens</bit-tab-link>
    <bit-tab-link [route]="['people']">People</bit-tab-link>
    <bit-tab-link [route]="['projects']">Projects</bit-tab-link>
  </bit-tab-nav-bar>
  <button slot="secondary" type="button" bitButton buttonType="secondary" (click)="edit()">
    Edit machine account
  </button>
  <sm-new-menu></sm-new-menu>
</app-header>
<router-outlet></router-outlet>

<app-header [title]="name()" icon="bwi-wrench">
  <bit-breadcrumbs slot="breadcrumbs">
    <bit-breadcrumb [route]="['/sm', organizationId, 'machine-accounts']" icon="bwi-angle-left">
      {{ "machineAccounts" | i18n }}
    </bit-breadcrumb>
  </bit-breadcrumbs>
  <bit-tab-nav-bar [label]="'machineAccount' | i18n" slot="tabs">
    <bit-tab-link [route]="['access-tokens']">{{ "accessTokens" | i18n }}</bit-tab-link>
    <bit-tab-link [route]="['people']">{{ "people" | i18n }}</bit-tab-link>
    <bit-tab-link [route]="['projects']">{{ "projects" | i18n }}</bit-tab-link>
  </bit-tab-nav-bar>
  <button slot="secondary" type="button" bitButton buttonType="secondary" (click)="edit()">
    {{ "editMachineAccount" | i18n }}
  </button>
  <sm-new-menu></sm-new-menu>
</app-header>
<router-outlet></router-outlet>

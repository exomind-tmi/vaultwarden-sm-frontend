<div class="tw-px-6 tw-pt-6">
  <h1 class="tw-m-0 tw-text-2xl tw-font-semibold tw-text-main">Secrets Manager</h1>
  <nav
    class="tw-mt-4 tw-flex tw-gap-1 tw-border-0 tw-border-b tw-border-solid tw-border-secondary-300"
  >
    <a
      *ngFor="let tab of tabs"
      [routerLink]="['/sm', organizationId$ | async, tab.path]"
      routerLinkActive="!tw-border-primary-600 !tw-text-primary-600 tw-font-semibold"
      class="tw-border-0 tw-border-b-2 tw-border-solid tw-border-transparent tw-px-4 tw-py-2 tw-text-muted tw-no-underline hover:tw-text-main"
      >{{ tab.label }}</a
    >
  </nav>
</div>
<router-outlet></router-outlet>

<app-header title="Machine accounts">
  <bit-search
    ngModel
    (ngModelChange)="dataSource.filter = $event"
    placeholder="Search machine accounts"
    class="tw-w-80"
  ></bit-search>
  <sm-new-menu></sm-new-menu>
</app-header>

<div class="tw-p-6">
  <p *ngIf="failed()" class="tw-text-danger">Failed to load machine accounts.</p>

  <div *ngIf="loading()" class="tw-pt-16 tw-text-center tw-text-muted">
    <i class="bwi bwi-spinner bwi-spin bwi-2x" aria-hidden="true"></i>
  </div>

  <ng-container *ngIf="!loading() && !failed()">
    <div
      *ngIf="!hasMachineAccounts"
      class="tw-rounded tw-border tw-border-dashed tw-border-secondary-300 tw-p-12 tw-text-center tw-text-muted"
    >
      No machine accounts yet. Create one to issue access tokens for automation.
    </div>

    <bit-table *ngIf="hasMachineAccounts" [dataSource]="dataSource">
      <ng-container header>
        <tr>
          <th bitCell bitSortable="name" default>Name</th>
          <th bitCell bitSortable="revisionDate" class="tw-whitespace-nowrap">Last edited</th>
          <th bitCell class="tw-w-0"></th>
        </tr>
      </ng-container>
      <ng-template body let-rows$>
        <tr bitRow *ngFor="let machineAccount of rows$ | async">
          <td bitCell>
            <div class="tw-flex tw-items-center tw-gap-4 tw-break-all">
              <i class="bwi bwi-wrench tw-text-muted" aria-hidden="true"></i>
              <div>
                <a
                  bitLink
                  [routerLink]="['/sm', organizationId, 'machine-accounts', machineAccount.id]"
                  >{{ machineAccount.name }}</a
                >
                <div class="tw-block tw-text-sm tw-text-muted">
                  {{ machineAccount.id }}
                  <button
                    type="button"
                    bitIconButton="bwi-clone"
                    buttonType="primaryGhost"
                    size="small"
                    title="Copy machine account ID"
                    (click)="copyId(machineAccount.id)"
                  ></button>
                </div>
              </div>
            </div>
          </td>
          <td bitCell class="tw-whitespace-nowrap">
            {{ machineAccount.revisionDate | date: "medium" }}
          </td>
          <td bitCell>
            <button
              type="button"
              bitIconButton="bwi-ellipsis-v"
              buttonType="primaryGhost"
              [bitMenuTriggerFor]="maMenu"
              title="Options"
            ></button>
          </td>
          <bit-menu #maMenu>
            <a
              bitMenuItem
              [routerLink]="['/sm', organizationId, 'machine-accounts', machineAccount.id]"
            >
              <i class="bwi bwi-fw bwi-eye" aria-hidden="true"></i> View machine account
            </a>
            <button type="button" bitMenuItem (click)="edit(machineAccount)">
              <i class="bwi bwi-fw bwi-pencil" aria-hidden="true"></i> Edit machine account
            </button>
            <button type="button" bitMenuItem variant="danger" (click)="remove(machineAccount)">
              <i class="bwi bwi-fw bwi-trash" aria-hidden="true"></i> Delete machine account
            </button>
          </bit-menu>
        </tr>
      </ng-template>
    </bit-table>
  </ng-container>
</div>

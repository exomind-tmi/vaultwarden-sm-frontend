<div *ngIf="loading()" class="tw-pt-16 tw-text-center tw-text-muted">
  <i class="bwi bwi-spinner bwi-spin bwi-2x" aria-hidden="true"></i>
</div>

<p *ngIf="failed()" class="tw-text-danger">{{ "smLoadFailed" | i18n }}</p>

<div *ngIf="!loading() && !failed()" class="tw-max-w-3xl">
  <p class="tw-mt-6">{{ hint }}</p>

  <!-- Pick grantees (several at once, type to filter), then Add puts them in the list. -->
  <div class="tw-flex tw-items-start tw-gap-3">
    <bit-form-field class="tw-grow">
      <bit-label>{{ label }}</bit-label>
      <bit-multi-select
        class="tw-w-full"
        [baseItems]="available()"
        [ngModel]="picked()"
        (ngModelChange)="picked.set($event)"
      />
      <bit-hint>{{ selectHint }}</bit-hint>
    </bit-form-field>
    <button
      type="button"
      bitButton
      buttonType="secondary"
      class="tw-mt-7"
      [disabled]="picked().length === 0"
      (click)="add()"
    >
      {{ "add" | i18n }}
    </button>
  </div>

  <div
    *ngIf="dataSource.data.length === 0"
    class="tw-rounded tw-border tw-border-dashed tw-border-secondary-300 tw-p-6 tw-text-center tw-text-sm tw-text-muted"
  >
    {{ emptyMessage }}
  </div>

  <bit-table *ngIf="dataSource.data.length > 0" [dataSource]="dataSource">
    <ng-container header>
      <tr>
        <th bitCell>{{ "name" | i18n }}</th>
        <th bitCell class="tw-w-64">{{ "permissions" | i18n }}</th>
        <th bitCell class="tw-w-0"></th>
      </tr>
    </ng-container>
    <ng-template body let-rows$>
      <tr bitRow *ngFor="let row of rows$ | async">
        <td bitCell>
          <i class="bwi bwi-fw tw-mr-2 tw-text-muted {{ iconOf(row.kind) }}" aria-hidden="true"></i>
          {{ row.name }}
          <span *ngIf="row.currentUser" class="tw-text-muted"
            >({{ "selfOwnershipLabel" | i18n }})</span
          >
        </td>
        <td bitCell>
          <span *ngIf="writeMode === 'forced'" class="tw-text-muted">{{
            "canReadWrite" | i18n
          }}</span>
          <bit-form-field *ngIf="writeMode === 'choice'" disableMargin>
            <bit-select
              bitInput
              [ngModel]="row.write"
              (ngModelChange)="setPermission(row.key, $event)"
              appA11yTitle="{{ row.name }} {{ 'permissions' | i18n }}"
            >
              <bit-option [value]="false" [label]="'canRead' | i18n" />
              <bit-option [value]="true" [label]="'canReadWrite' | i18n" />
            </bit-select>
          </bit-form-field>
        </td>
        <td bitCell class="tw-text-right">
          <button
            type="button"
            bitIconButton="bwi-close"
            buttonType="primaryGhost"
            size="small"
            [title]="'remove' | i18n"
            (click)="remove(row.key)"
          ></button>
        </td>
      </tr>
    </ng-template>
  </bit-table>

  <button
    type="button"
    bitButton
    buttonType="primary"
    class="tw-mt-7"
    [disabled]="saving()"
    (click)="submit()"
  >
    {{ "save" | i18n }}
  </button>
</div>

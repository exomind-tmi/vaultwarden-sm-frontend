<div *ngIf="loading()" class="tw-pt-16 tw-text-center tw-text-muted">
  <i class="bwi bwi-spinner bwi-spin bwi-2x" aria-hidden="true"></i>
</div>

<p *ngIf="failed()" class="tw-text-danger">{{ "smLoadFailed" | i18n }}</p>

<div *ngIf="!loading() && !failed()" class="tw-max-w-3xl">
  <p class="tw-mt-6 tw-text-muted">{{ hint }}</p>

  <!-- Add a grantee. -->
  <div class="tw-mb-5 tw-flex tw-items-end tw-gap-3">
    <div class="tw-flex-1">
      <label for="access-add" class="tw-mb-1 tw-block tw-text-sm tw-font-semibold tw-text-main">
        {{ "add" | i18n }}
      </label>
      <select
        id="access-add"
        bitInput
        class="tw-w-full"
        [value]="selection()"
        [disabled]="nothingToAdd()"
        (change)="select($event)"
      >
        <option value="">{{ "multiSelectPlaceholder" | i18n }}</option>
        <!-- One group per grantee kind; a single kind needs no group heading. -->
        <ng-container *ngFor="let group of available()">
          <optgroup
            *ngIf="available().length > 1; else plain"
            [label]="kinds[group.kind].groupKey | i18n"
          >
            <option *ngFor="let g of group.grantees" [value]="rowKey(group.kind, g.id)">
              {{ g.name }}
            </option>
          </optgroup>
          <ng-template #plain>
            <option *ngFor="let g of group.grantees" [value]="rowKey(group.kind, g.id)">
              {{ g.name }}
            </option>
          </ng-template>
        </ng-container>
      </select>
    </div>
    <button
      type="button"
      bitButton
      buttonType="secondary"
      [disabled]="!selection()"
      (click)="add()"
    >
      {{ "add" | i18n }}
    </button>
  </div>

  <div
    *ngIf="dataSource.data.length === 0"
    class="tw-rounded tw-border tw-border-dashed tw-border-secondary-300 tw-p-6 tw-text-center tw-text-sm tw-text-muted"
  >
    {{ emptyMessage }}
  </div>

  <bit-table *ngIf="dataSource.data.length > 0" [dataSource]="dataSource">
    <ng-container header>
      <tr>
        <th bitCell>{{ "name" | i18n }}</th>
        <th bitCell class="tw-w-64">{{ "permissions" | i18n }}</th>
        <th bitCell class="tw-w-0"></th>
      </tr>
    </ng-container>
    <ng-template body let-rows$>
      <tr bitRow *ngFor="let row of rows$ | async">
        <td bitCell>
          <i
            class="bwi bwi-fw tw-mr-2 tw-text-muted {{ iconOf(row.kind) }}"
            aria-hidden="true"
          ></i>
          {{ row.name }}
          <span *ngIf="row.currentUser" class="tw-text-muted"
            >({{ "selfOwnershipLabel" | i18n }})</span
          >
        </td>
        <td bitCell>
          <span *ngIf="writeMode === 'forced'" class="tw-text-muted">{{
            "canReadWrite" | i18n
          }}</span>
          <select
            *ngIf="writeMode === 'choice'"
            bitInput
            [value]="row.write ? 'rw' : 'r'"
            (change)="setPermission(row.key, $any($event.target).value)"
          >
            <option value="r">{{ "canRead" | i18n }}</option>
            <option value="rw">{{ "canReadWrite" | i18n }}</option>
          </select>
        </td>
        <td bitCell class="tw-text-right">
          <button
            type="button"
            bitIconButton="bwi-close"
            buttonType="primaryGhost"
            size="small"
            [title]="'remove' | i18n"
            (click)="remove(row.key)"
          ></button>
        </td>
      </tr>
    </ng-template>
  </bit-table>

  <button
    type="button"
    bitButton
    buttonType="primary"
    class="tw-mt-7"
    [disabled]="saving()"
    (click)="submit()"
  >
    {{ "save" | i18n }}
  </button>
</div>

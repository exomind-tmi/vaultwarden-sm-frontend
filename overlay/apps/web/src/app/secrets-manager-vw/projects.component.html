<div class="tw-p-6">
  <div class="tw-mb-6 tw-flex tw-items-center tw-justify-between">
    <h1 class="tw-m-0 tw-text-2xl tw-font-semibold tw-text-main">Projects</h1>
    <button type="button" bitButton buttonType="primary" (click)="add()">New project</button>
  </div>

  <p *ngIf="error()" class="tw-text-danger">{{ error() }}</p>

  <p *ngIf="loading()" class="tw-text-muted">Loading…</p>

  <ng-container *ngIf="!loading() && !error()">
    <p *ngIf="projects().length === 0" class="tw-text-muted">
      No projects yet. Create one to group your secrets.
    </p>

    <table *ngIf="projects().length > 0" class="tw-w-full tw-text-left">
      <thead>
        <tr class="tw-border-0 tw-border-b tw-border-solid tw-border-secondary-300">
          <th class="tw-py-2 tw-font-semibold tw-text-muted">Name</th>
          <th class="tw-w-24 tw-py-2"></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let project of projects()"
          class="tw-border-0 tw-border-b tw-border-solid tw-border-secondary-200"
        >
          <td class="tw-py-2 tw-text-main">{{ project.name }}</td>
          <td class="tw-py-1 tw-text-right">
            <button
              type="button"
              bitIconButton="bwi-pencil"
              size="small"
              title="Edit"
              (click)="edit(project)"
            ></button>
            <button
              type="button"
              bitIconButton="bwi-trash"
              size="small"
              title="Delete"
              (click)="remove(project)"
            ></button>
          </td>
        </tr>
      </tbody>
    </table>
  </ng-container>
</div>

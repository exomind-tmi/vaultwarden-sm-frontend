<app-header title="Projects">
  <bit-search
    ngModel
    (ngModelChange)="dataSource.filter = $event"
    placeholder="Search projects"
    class="tw-w-80"
  ></bit-search>
  <sm-new-menu></sm-new-menu>
</app-header>

<div class="tw-p-6">
  <p *ngIf="failed()" class="tw-text-danger">Failed to load projects.</p>

  <div *ngIf="loading()" class="tw-pt-16 tw-text-center tw-text-muted">
    <i class="bwi bwi-spinner bwi-spin bwi-2x" aria-hidden="true"></i>
  </div>

  <ng-container *ngIf="!loading() && !failed()">
    <div
      *ngIf="!hasProjects"
      class="tw-rounded tw-border tw-border-dashed tw-border-secondary-300 tw-p-12 tw-text-center tw-text-muted"
    >
      No projects yet. Create one to group your secrets.
    </div>

    <bit-table *ngIf="hasProjects" [dataSource]="dataSource">
      <ng-container header>
        <tr>
          <th bitCell bitSortable="name" default>Name</th>
          <th bitCell bitSortable="revisionDate" class="tw-whitespace-nowrap">Last edited</th>
          <th bitCell class="tw-w-0"></th>
        </tr>
      </ng-container>
      <ng-template body let-rows$>
        <tr bitRow *ngFor="let project of rows$ | async">
          <td bitCell>
            <div class="tw-flex tw-items-center tw-gap-4 tw-break-all">
              <i class="bwi bwi-collection tw-text-muted" aria-hidden="true"></i>
              <div>
                <a
                  bitLink
                  [routerLink]="['/sm', organizationId, 'projects', project.id]"
                  >{{ project.name }}</a
                >
                <div class="tw-block tw-text-sm tw-text-muted">
                  {{ project.id }}
                  <button
                    type="button"
                    bitIconButton="bwi-clone"
                    buttonType="primaryGhost"
                    size="small"
                    title="Copy project ID"
                    (click)="copyId(project.id)"
                  ></button>
                </div>
              </div>
            </div>
          </td>
          <td bitCell class="tw-whitespace-nowrap">{{ project.revisionDate | date: "medium" }}</td>
          <td bitCell>
            <button
              type="button"
              bitIconButton="bwi-ellipsis-v"
              buttonType="primaryGhost"
              [bitMenuTriggerFor]="projectMenu"
              title="Options"
            ></button>
          </td>
          <bit-menu #projectMenu>
            <a bitMenuItem [routerLink]="['/sm', organizationId, 'projects', project.id]">
              <i class="bwi bwi-fw bwi-eye" aria-hidden="true"></i> View project
            </a>
            <button type="button" bitMenuItem (click)="edit(project)">
              <i class="bwi bwi-fw bwi-pencil" aria-hidden="true"></i> Edit project
            </button>
            <button type="button" bitMenuItem variant="danger" (click)="remove(project)">
              <i class="bwi bwi-fw bwi-trash" aria-hidden="true"></i> Delete project
            </button>
          </bit-menu>
        </tr>
      </ng-template>
    </bit-table>
  </ng-container>
</div>

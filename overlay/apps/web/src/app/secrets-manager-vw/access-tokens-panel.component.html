<!-- One-time reveal of a freshly created token. -->
<div
  *ngIf="newToken() as token"
  class="tw-mb-4 tw-max-w-xl tw-rounded tw-border tw-border-solid tw-border-success-500 tw-bg-success-100 tw-p-3"
>
  <p class="tw-mb-2 tw-text-sm tw-font-semibold tw-text-success-700">
    Copy this access token now — it will not be shown again.
  </p>
  <div class="tw-flex tw-items-center tw-gap-2">
    <input bitInput type="text" readonly [value]="token" class="tw-flex-1 tw-font-mono tw-text-xs" />
    <button type="button" bitButton buttonType="primary" size="small" (click)="copy()">Copy</button>
    <button
      type="button"
      bitIconButton="bwi-close"
      size="small"
      title="Dismiss"
      (click)="dismissNewToken()"
    ></button>
  </div>
</div>

<!-- Issue a new token. -->
<div class="tw-mb-4 tw-max-w-md">
  <label for="new-token-name" class="tw-mb-1 tw-block tw-text-sm tw-font-semibold tw-text-main">
    New token name
  </label>
  <div class="tw-flex tw-items-center tw-gap-2">
    <input
      id="new-token-name"
      bitInput
      type="text"
      class="tw-flex-1"
      [formControl]="name"
      (keyup.enter)="create()"
    />
    <button
      type="button"
      bitButton
      buttonType="primary"
      [disabled]="creating() || name.invalid"
      (click)="create()"
    >
      Create
    </button>
  </div>
</div>

<p *ngIf="failed()" class="tw-text-danger">Failed to load access tokens.</p>
<p *ngIf="loading()" class="tw-text-muted">Loading…</p>

<ng-container *ngIf="!loading() && !failed()">
  <div
    *ngIf="tokens().length === 0"
    class="tw-max-w-md tw-rounded tw-border tw-border-dashed tw-border-secondary-300 tw-p-6 tw-text-center tw-text-muted"
  >
    No access tokens yet.
  </div>

  <table *ngIf="tokens().length > 0" class="tw-w-full tw-max-w-md tw-border-collapse tw-text-left">
    <tbody>
      <tr
        *ngFor="let token of tokens()"
        class="tw-border-0 tw-border-b tw-border-solid tw-border-secondary-200"
      >
        <td class="tw-py-3 tw-pr-4 tw-text-main">{{ token.name }}</td>
        <td class="tw-w-10 tw-py-1 tw-text-right">
          <button
            type="button"
            bitIconButton="bwi-trash"
            size="small"
            title="Revoke"
            (click)="revoke(token)"
          ></button>
        </td>
      </tr>
    </tbody>
  </table>
</ng-container>

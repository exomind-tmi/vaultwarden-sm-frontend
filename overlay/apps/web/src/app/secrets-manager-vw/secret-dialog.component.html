<bit-dialog>
  <span bitDialogTitle>{{ title }}</span>
  <ng-container bitDialogContent>
    <p *ngIf="loading()" class="tw-text-muted">Loading…</p>
    <form *ngIf="!loading()" [formGroup]="form" class="tw-flex tw-flex-col tw-gap-3">
      <bit-form-field>
        <bit-label>Name</bit-label>
        <input bitInput type="text" formControlName="key" />
      </bit-form-field>
      <bit-form-field>
        <bit-label>Value</bit-label>
        <textarea bitInput rows="3" formControlName="value"></textarea>
      </bit-form-field>
      <bit-form-field>
        <bit-label>Notes</bit-label>
        <textarea bitInput rows="2" formControlName="note"></textarea>
      </bit-form-field>
      <bit-form-field>
        <bit-label>Project</bit-label>
        <select bitInput formControlName="projectId">
          <option value="">No project</option>
          <option *ngFor="let p of projects()" [value]="p.id">{{ p.name }}</option>
        </select>
      </bit-form-field>
      <p *ngIf="failed()" class="tw-text-danger">Could not save the secret. Please try again.</p>
    </form>
  </ng-container>
  <ng-container bitDialogFooter>
    <button
      type="button"
      bitButton
      buttonType="primary"
      [disabled]="saving() || loading()"
      (click)="submit()"
    >
      Save
    </button>
    <button type="button" bitButton buttonType="secondary" bitDialogClose>Cancel</button>
  </ng-container>
</bit-dialog>

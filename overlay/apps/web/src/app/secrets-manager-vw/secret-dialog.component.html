<bit-dialog>
  <span bitDialogTitle>{{ titleKey | i18n }}</span>
  <ng-container bitDialogContent>
    <p *ngIf="loading()" class="tw-text-muted">{{ "loading" | i18n }}</p>
    <form *ngIf="!loading()" [formGroup]="form" class="tw-flex tw-flex-col tw-gap-3">
      <bit-form-field>
        <bit-label>{{ "name" | i18n }}</bit-label>
        <input bitInput type="text" formControlName="key" />
      </bit-form-field>
      <bit-form-field>
        <bit-label>{{ "value" | i18n }}</bit-label>
        <textarea bitInput rows="3" formControlName="value"></textarea>
      </bit-form-field>
      <bit-form-field>
        <bit-label>{{ "notes" | i18n }}</bit-label>
        <textarea bitInput rows="2" formControlName="note"></textarea>
      </bit-form-field>
      <bit-form-field>
        <bit-label>{{ "project" | i18n }}</bit-label>
        <bit-select bitInput formControlName="projectId">
          <bit-option value="" [label]="'smNoProject' | i18n" />
          <bit-option *ngFor="let p of projects()" [value]="p.id" [label]="p.name" />
        </bit-select>
      </bit-form-field>
      <p *ngIf="failed()" class="tw-text-danger">{{ "errorOccurred" | i18n }}</p>
    </form>
  </ng-container>
  <ng-container bitDialogFooter>
    <button
      type="button"
      bitButton
      buttonType="primary"
      [disabled]="saving() || loading()"
      (click)="submit()"
    >
      {{ "save" | i18n }}
    </button>
    <button type="button" bitButton buttonType="secondary" bitDialogClose>
      {{ "cancel" | i18n }}
    </button>
  </ng-container>
</bit-dialog>

<app-header [title]="name()" icon="bwi-collection">
  <bit-breadcrumbs slot="breadcrumbs">
    <bit-breadcrumb [route]="['/sm', organizationId, 'projects']" icon="bwi-angle-left">
      Projects
    </bit-breadcrumb>
  </bit-breadcrumbs>
  <bit-tab-nav-bar label="Project" slot="tabs">
    <bit-tab-link [route]="['secrets']">Secrets</bit-tab-link>
    <bit-tab-link [route]="['people']">People</bit-tab-link>
    <bit-tab-link [route]="['machine-accounts']">Machine accounts</bit-tab-link>
  </bit-tab-nav-bar>
  <button slot="secondary" type="button" bitButton buttonType="secondary" (click)="edit()">
    Edit project
  </button>
</app-header>
<router-outlet></router-outlet>

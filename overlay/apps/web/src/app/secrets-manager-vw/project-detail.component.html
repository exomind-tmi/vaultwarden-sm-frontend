<app-header [title]="name()" icon="bwi-collection">
  <bit-breadcrumbs slot="breadcrumbs">
    <bit-breadcrumb [route]="['/sm', organizationId, 'projects']" icon="bwi-angle-left">
      {{ "projects" | i18n }}
    </bit-breadcrumb>
  </bit-breadcrumbs>
  <bit-tab-nav-bar [label]="'project' | i18n" slot="tabs">
    <bit-tab-link [route]="['secrets']">{{ "secrets" | i18n }}</bit-tab-link>
    <bit-tab-link [route]="['access']">{{ "smAccess" | i18n }}</bit-tab-link>
  </bit-tab-nav-bar>
  <button slot="secondary" type="button" bitButton buttonType="secondary" (click)="edit()">
    {{ "editProject" | i18n }}
  </button>
  <sm-new-menu></sm-new-menu>
</app-header>
<router-outlet></router-outlet>

<p *ngIf="failed()" class="tw-text-danger">Failed to load access policies.</p>
<p *ngIf="loading()" class="tw-text-muted">Loading…</p>

<ng-container *ngIf="!loading() && !failed()">
  <!-- Add a grantee by typing or picking from the list; applied immediately. -->
  <div class="tw-mb-4 tw-max-w-md">
    <input
      bitInput
      type="text"
      class="tw-w-full"
      placeholder="Add…"
      [attr.list]="listId"
      [disabled]="busy() || available().length === 0"
      (change)="addByName($event)"
    />
    <datalist [id]="listId">
      <option *ngFor="let g of available()" [value]="g.name"></option>
    </datalist>
  </div>

  <div
    *ngIf="rows().length === 0"
    class="tw-rounded tw-border tw-border-dashed tw-border-secondary-300 tw-p-6 tw-text-center tw-text-sm tw-text-muted"
  >
    {{ emptyText }}
  </div>

  <table *ngIf="rows().length > 0" class="tw-w-full tw-max-w-md tw-border-collapse tw-text-left">
    <tbody>
      <tr
        *ngFor="let row of rows()"
        class="tw-border-0 tw-border-b tw-border-solid tw-border-secondary-200"
      >
        <td class="tw-py-2 tw-pr-4 tw-text-main">
          {{ row.name }}
          <span *ngIf="row.currentUser" class="tw-text-muted">(you)</span>
        </td>
        <td class="tw-w-36 tw-py-2 tw-pr-4 tw-text-sm tw-text-muted">
          <ng-container *ngIf="writeMode === 'forced'">Read / write</ng-container>
          <label
            *ngIf="writeMode === 'optional'"
            class="tw-m-0 tw-flex tw-items-center tw-gap-2"
          >
            <input
              type="checkbox"
              [checked]="row.write"
              [disabled]="busy()"
              (change)="toggleWrite(row.id)"
            />
            Can write
          </label>
        </td>
        <td class="tw-w-10 tw-py-1 tw-text-right">
          <button
            type="button"
            bitIconButton="bwi-close"
            size="small"
            title="Remove"
            [disabled]="busy()"
            (click)="remove(row.id)"
          ></button>
        </td>
      </tr>
    </tbody>
  </table>
</ng-container>

<div class="tw-p-6">
  <div class="tw-mb-4 tw-flex tw-items-center tw-justify-end">
    <button type="button" bitButton buttonType="primary" (click)="add()">New secret</button>
  </div>

  <p *ngIf="failed()" class="tw-text-danger">Failed to load secrets.</p>
  <p *ngIf="loading()" class="tw-text-muted">Loading…</p>

  <ng-container *ngIf="!loading() && !failed()">
    <div
      *ngIf="secrets().length === 0"
      class="tw-rounded tw-border tw-border-dashed tw-border-secondary-300 tw-p-10 tw-text-center tw-text-muted"
    >
      No secrets yet. Create one to store a credential.
    </div>

    <table *ngIf="secrets().length > 0" class="tw-w-full tw-border-collapse tw-text-left">
      <thead>
        <tr class="tw-border-0 tw-border-b tw-border-solid tw-border-secondary-300">
          <th class="tw-py-2 tw-pr-4 tw-text-sm tw-font-semibold tw-uppercase tw-text-muted">Name</th>
          <th class="tw-py-2 tw-pr-4 tw-text-sm tw-font-semibold tw-uppercase tw-text-muted">
            Projects
          </th>
          <th class="tw-w-24 tw-py-2"></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let secret of secrets()"
          class="tw-border-0 tw-border-b tw-border-solid tw-border-secondary-200 hover:tw-bg-background-alt"
        >
          <td class="tw-py-3 tw-pr-4 tw-font-mono tw-text-main">{{ secret.key }}</td>
          <td class="tw-py-3 tw-pr-4 tw-text-muted">{{ projectNames(secret) || "—" }}</td>
          <td class="tw-whitespace-nowrap tw-py-1 tw-text-right">
            <button
              type="button"
              bitIconButton="bwi-pencil"
              size="small"
              title="Edit"
              (click)="edit(secret)"
            ></button>
            <button
              type="button"
              bitIconButton="bwi-trash"
              size="small"
              title="Delete"
              (click)="remove(secret)"
            ></button>
          </td>
        </tr>
      </tbody>
    </table>
  </ng-container>
</div>

<div class="tw-p-6">
  <div class="tw-mb-5 tw-flex tw-items-center tw-justify-between tw-gap-4">
    <h1 class="tw-m-0 tw-text-2xl tw-font-semibold tw-text-main">Secrets</h1>
    <div class="tw-flex tw-items-center tw-gap-3">
      <input
        bitInput
        type="search"
        placeholder="Search secrets"
        class="tw-w-64"
        (input)="dataSource.filter = $any($event.target).value"
      />
      <button type="button" bitButton buttonType="primary" (click)="add()">New secret</button>
    </div>
  </div>

  <p *ngIf="failed()" class="tw-text-danger">Failed to load secrets.</p>

  <div *ngIf="loading()" class="tw-pt-16 tw-text-center tw-text-muted">
    <i class="bwi bwi-spinner bwi-spin bwi-2x" aria-hidden="true"></i>
  </div>

  <ng-container *ngIf="!loading() && !failed()">
    <div
      *ngIf="!hasSecrets"
      class="tw-rounded tw-border tw-border-dashed tw-border-secondary-300 tw-p-12 tw-text-center tw-text-muted"
    >
      <p class="tw-mb-3">No secrets yet. Create one to store a credential.</p>
      <button type="button" bitButton buttonType="secondary" (click)="add()">New secret</button>
    </div>

    <bit-table *ngIf="hasSecrets" [dataSource]="dataSource">
      <ng-container header>
        <tr>
          <th bitCell bitSortable="key" default>Name</th>
          <th bitCell>Project</th>
          <th bitCell bitSortable="revisionDate" class="tw-whitespace-nowrap">Last edited</th>
          <th bitCell class="tw-w-0"></th>
        </tr>
      </ng-container>
      <ng-template body let-rows$>
        <tr bitRow *ngFor="let secret of rows$ | async">
          <td bitCell>
            <div class="tw-flex tw-items-center tw-gap-4 tw-break-all">
              <i class="bwi bwi-key tw-text-muted" aria-hidden="true"></i>
              <div>
                <span class="tw-font-mono">{{ secret.key }}</span>
                <div class="tw-block tw-text-sm tw-text-muted">
                  {{ secret.id }}
                  <button
                    type="button"
                    bitIconButton="bwi-clone"
                    buttonType="primaryGhost"
                    size="small"
                    title="Copy secret ID"
                    (click)="copyId(secret.id)"
                  ></button>
                </div>
              </div>
            </div>
          </td>
          <td bitCell>
            <span *ngIf="projectName(secret) as name" bitBadge variant="secondary">{{ name }}</span>
          </td>
          <td bitCell class="tw-whitespace-nowrap">{{ secret.revisionDate | date: "medium" }}</td>
          <td bitCell>
            <button
              type="button"
              bitIconButton="bwi-ellipsis-v"
              buttonType="primaryGhost"
              [bitMenuTriggerFor]="secretMenu"
              title="Options"
            ></button>
          </td>
          <bit-menu #secretMenu>
            <button type="button" bitMenuItem (click)="copyValue(secret)">
              <i class="bwi bwi-fw bwi-clone" aria-hidden="true"></i> Copy value
            </button>
            <button type="button" bitMenuItem (click)="edit(secret)">
              <i class="bwi bwi-fw bwi-pencil" aria-hidden="true"></i> Edit secret
            </button>
            <button type="button" bitMenuItem variant="danger" (click)="remove(secret)">
              <i class="bwi bwi-fw bwi-trash" aria-hidden="true"></i> Delete secret
            </button>
          </bit-menu>
        </tr>
      </ng-template>
    </bit-table>
  </ng-container>
</div>

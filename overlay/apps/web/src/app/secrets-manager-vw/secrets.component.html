<app-header [title]="'secrets' | i18n">
  <bit-search
    ngModel
    (ngModelChange)="dataSource.filter = $event"
    [placeholder]="'searchSecrets' | i18n"
    class="tw-w-80"
  ></bit-search>
  <sm-new-menu></sm-new-menu>
</app-header>

<div class="tw-p-6">
  <p *ngIf="failed()" class="tw-text-danger">{{ "smLoadFailed" | i18n }}</p>

  <div *ngIf="loading()" class="tw-pt-16 tw-text-center tw-text-muted">
    <i class="bwi bwi-spinner bwi-spin bwi-2x" aria-hidden="true"></i>
  </div>

  <ng-container *ngIf="!loading() && !failed()">
    <div
      *ngIf="!hasSecrets"
      class="tw-rounded tw-border tw-border-dashed tw-border-secondary-300 tw-p-12 tw-text-center tw-text-muted"
    >
      {{ "secretsNoItemsTitle" | i18n }}
    </div>

    <bit-table *ngIf="hasSecrets" [dataSource]="dataSource">
      <ng-container header>
        <tr>
          <th bitCell bitSortable="key" default>{{ "name" | i18n }}</th>
          <th bitCell>{{ "project" | i18n }}</th>
          <th bitCell bitSortable="revisionDate" class="tw-whitespace-nowrap">
            {{ "lastEdited" | i18n }}
          </th>
          <th bitCell class="tw-w-0"></th>
        </tr>
      </ng-container>
      <ng-template body let-rows$>
        <tr bitRow *ngFor="let secret of rows$ | async">
          <td bitCell>
            <div class="tw-flex tw-items-center tw-gap-4 tw-break-all">
              <i class="bwi bwi-key tw-text-muted" aria-hidden="true"></i>
              <div>
                <button type="button" bitLink (click)="edit(secret)">{{ secret.key }}</button>
                <div class="tw-block tw-text-sm tw-text-muted">
                  {{ secret.id }}
                  <button
                    type="button"
                    bitIconButton="bwi-clone"
                    buttonType="primaryGhost"
                    size="small"
                    [title]="'copyUuid' | i18n"
                    (click)="copyId(secret.id)"
                  ></button>
                </div>
              </div>
            </div>
          </td>
          <td bitCell>
            <span *ngIf="projectName(secret) as name; else unassigned" bitBadge variant="secondary">
              {{ name }}
            </span>
            <!-- Without a project only Owners/Admins reach the secret, so it is flagged. Once secrets
                 can be granted directly, flag only those with neither a project nor a grant. -->
            <ng-template #unassigned>
              <span bitBadge variant="warning">
                <i class="bwi bwi-exclamation-circle" aria-hidden="true"></i>
                {{ "unassigned" | i18n }}
              </span>
            </ng-template>
          </td>
          <td bitCell class="tw-whitespace-nowrap">{{ secret.revisionDate | date: "medium" }}</td>
          <td bitCell>
            <button
              type="button"
              bitIconButton="bwi-ellipsis-v"
              buttonType="primaryGhost"
              [bitMenuTriggerFor]="secretMenu"
              [title]="'options' | i18n"
            ></button>
          </td>
          <bit-menu #secretMenu>
            <button type="button" bitMenuItem (click)="copyValue(secret)">
              <i class="bwi bwi-fw bwi-clone" aria-hidden="true"></i> {{ "copyValue" | i18n }}
            </button>
            <button type="button" bitMenuItem (click)="edit(secret)">
              <ng-container *ngIf="secret.write; else view">
                <i class="bwi bwi-fw bwi-pencil" aria-hidden="true"></i> {{ "editSecret" | i18n }}
              </ng-container>
              <ng-template #view>
                <i class="bwi bwi-fw bwi-eye" aria-hidden="true"></i> {{ "viewSecret" | i18n }}
              </ng-template>
            </button>
            <button
              *ngIf="secret.write"
              type="button"
              bitMenuItem
              variant="danger"
              (click)="remove(secret)"
            >
              <i class="bwi bwi-fw bwi-trash" aria-hidden="true"></i> {{ "deleteSecret" | i18n }}
            </button>
          </bit-menu>
        </tr>
      </ng-template>
    </bit-table>
  </ng-container>
</div>

<bit-dialog>
  <span bitDialogTitle>{{ titleKey | i18n }}</span>
  <ng-container bitDialogContent>
    <bit-form-field>
      <bit-label>{{ "name" | i18n }}</bit-label>
      <input bitInput type="text" [formControl]="name" />
    </bit-form-field>
    <p *ngIf="failed()" class="tw-mt-2 tw-text-danger">
      {{ "errorOccurred" | i18n }}
    </p>
  </ng-container>
  <ng-container bitDialogFooter>
    <button type="button" bitButton buttonType="primary" [disabled]="saving()" (click)="submit()">
      {{ "save" | i18n }}
    </button>
    <button type="button" bitButton buttonType="secondary" bitDialogClose>
      {{ "cancel" | i18n }}
    </button>
  </ng-container>
</bit-dialog>
